name: Windows CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  build-test:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Public file, secret, and license policy
        shell: pwsh
        run: .github/scripts/Test-PublicRepositoryPolicy.ps1
      - name: Build
        run: dotnet build GpuTestSuite.sln -c Release -p:Platform=x64 --nologo
      - name: Test
        run: dotnet test tests/GpuSuite.Tests/GpuSuite.Tests.csproj -c Release -p:Platform=x64 --no-build --nologo
      - name: Install Inno Setup
        run: choco install innosetup --no-progress -y
      - name: Stage installer compiler fixture
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Path release-stage -Force | Out-Null
          Set-Content release-stage\GpuSuite.App.exe '' -NoNewline
          Copy-Item REQUIREMENTS.txt release-stage -Force
          "#define MyAppVersion `"ci`"" | Set-Content installer\version.iss -NoNewline
      - name: Compile installer contract
        run: iscc installer\GpuTestSuite.iss
