name: Public installer release
on:
  push:
    tags: ['v*']
permissions:
  contents: write
jobs:
  release:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
      - name: Require a tag commit reachable from main
        shell: pwsh
        run: |
          git fetch origin main --tags --force
          git merge-base --is-ancestor $env:GITHUB_SHA origin/main
          if ($LASTEXITCODE -ne 0) { throw 'Release tags must point to a commit reachable from main.' }
      - name: Public file, secret, and license policy
        shell: pwsh
        run: .github/scripts/Test-PublicRepositoryPolicy.ps1
      - name: Build x64
        run: dotnet build GpuTestSuite.sln -c Release -p:Platform=x64 --nologo
      - name: Test x64
        run: dotnet test tests/GpuSuite.Tests/GpuSuite.Tests.csproj -c Release -p:Platform=x64 --no-build --nologo
      - run: choco install innosetup --no-progress -y
      - name: Publish self-contained Windows application
        run: dotnet publish src/GpuSuite.App/GpuSuite.App.csproj -c Release -r win-x64 --self-contained true --nologo -o release-stage
      - name: Generate and validate installer runtime attribution
        shell: pwsh
        run: |
          tools/Generate-ThirdPartyNotices.ps1 -ReleaseStage release-stage -OutputDirectory audit
          tools/Test-InstallerAttribution.ps1 -AuditDirectory audit -ReleaseStage release-stage
      - name: Stage verified public runtime content
        shell: pwsh
        run: |
          Copy-Item profiles release-stage\profiles -Recurse -Force
          Copy-Item settings.example.json release-stage\settings.json -Force
          Copy-Item REQUIREMENTS.txt release-stage -Force
          Copy-Item LICENSE,NOTICE release-stage -Force
          Copy-Item LICENSES release-stage\LICENSES -Recurse -Force
          Copy-Item audit\THIRD-PARTY-NOTICES.md release-stage -Force
          if (Test-Path audit\licenses) { Copy-Item audit\licenses release-stage\THIRD-PARTY-LICENSES -Recurse -Force }
          Copy-Item tools\PresentMon release-stage\tools\PresentMon -Recurse -Force
          "#define MyAppVersion `"${{ github.ref_name }}`"" | Set-Content installer\version.iss -NoNewline
      - run: iscc installer\GpuTestSuite.iss
      - name: Smoke package layout
        shell: pwsh
        run: |
          $setup = 'artifacts/installer/HardwareBustersGpuTestSuite-Setup.exe'
          if (-not (Test-Path $setup)) { throw 'Installer output is missing.' }
          $smokeRoot = Join-Path $env:RUNNER_TEMP 'HwbGpuSuiteSmoke'
          if (Test-Path -LiteralPath $smokeRoot) { Remove-Item -LiteralPath $smokeRoot -Recurse -Force }
          New-Item -ItemType Directory -Path $smokeRoot -Force | Out-Null
          $installer = Start-Process -FilePath $setup -ArgumentList @('/VERYSILENT', '/SUPPRESSMSGBOXES', '/NORESTART', ('/DIR="{0}"' -f $smokeRoot)) -Wait -PassThru
          if ($installer.ExitCode -ne 0) { throw "Installer smoke setup failed with exit code $($installer.ExitCode)." }
          $app = Join-Path $smokeRoot 'GpuSuite.App.exe'
          if (-not (Test-Path -LiteralPath $app)) { throw 'Installed executable smoke check failed: GpuSuite.App.exe is missing.' }
          $process = Start-Process $app -PassThru
          Start-Sleep -Seconds 5
          if ($process.HasExited) { throw 'Installed executable exited before launch smoke completed.' }
          Stop-Process -Id $process.Id -Force
          Get-FileHash $setup -Algorithm SHA256 | ForEach-Object { "SHA256  $($_.Hash)  $($_.Path)" } | Set-Content artifacts/installer/HardwareBustersGpuTestSuite-Setup.sha256
      - name: Verify release inputs before publication
        shell: pwsh
        run: |
          foreach ($required in @('artifacts/installer/HardwareBustersGpuTestSuite-Setup.exe', 'artifacts/installer/HardwareBustersGpuTestSuite-Setup.sha256', 'audit/sbom.cdx.json', 'audit/THIRD-PARTY-NOTICES.md')) {
            if (-not (Test-Path $required) -or (Get-Item $required).Length -eq 0) { throw "Required release input is missing or empty: $required" }
          }
      - name: Publish exactly the installer and generated metadata
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "${{ github.ref_name }}" artifacts/installer/HardwareBustersGpuTestSuite-Setup.exe artifacts/installer/HardwareBustersGpuTestSuite-Setup.sha256 audit/sbom.cdx.json audit/THIRD-PARTY-NOTICES.md --title "${{ github.ref_name }}" --generate-notes
